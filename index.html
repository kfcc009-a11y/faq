<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>업무 FAQ 검색</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        Pretendard,
        "Noto Sans KR",
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      background: #f5f7fb;
      color: #1f2937;
    }

    button,
    input {
      font: inherit;
    }

    .page {
      width: min(1100px, calc(100% - 40px));
      margin: 0 auto;
      padding: 56px 0 80px;
    }

    .header {
      margin-bottom: 32px;
    }

    .header-label {
      display: inline-block;
      margin-bottom: 10px;
      color: #4263eb;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    h1 {
      margin: 0;
      font-size: clamp(30px, 5vw, 42px);
      line-height: 1.25;
      letter-spacing: -0.04em;
    }

    .description {
      margin: 12px 0 0;
      color: #6b7280;
      font-size: 15px;
      line-height: 1.6;
    }

    .search-panel {
      padding: 24px;
      margin-bottom: 24px;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(15, 23, 42, 0.04);
    }

    .search-box {
      position: relative;
    }

    .search-icon {
      position: absolute;
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
      width: 22px;
      height: 22px;
      color: #9ca3af;
      pointer-events: none;
    }

    #searchInput {
      width: 100%;
      height: 58px;
      padding: 0 52px 0 52px;
      border: 1px solid #d1d5db;
      border-radius: 14px;
      outline: none;
      background: #ffffff;
      color: #111827;
      font-size: 16px;
      transition: 0.2s ease;
    }

    #searchInput::placeholder {
      color: #9ca3af;
    }

    #searchInput:focus {
      border-color: #4263eb;
      box-shadow: 0 0 0 4px rgba(66, 99, 235, 0.1);
    }

    .clear-search {
      position: absolute;
      right: 15px;
      top: 50%;
      transform: translateY(-50%);
      width: 30px;
      height: 30px;
      display: none;
      align-items: center;
      justify-content: center;
      border: 0;
      border-radius: 50%;
      background: #f1f3f5;
      color: #6b7280;
      cursor: pointer;
    }

    .clear-search:hover {
      background: #e5e7eb;
    }

    .filter-area {
      margin-top: 22px;
    }

    .filter-label {
      margin-bottom: 12px;
      font-size: 13px;
      color: #6b7280;
      font-weight: 700;
    }

    .category-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .category-button {
      padding: 9px 16px;
      border: 1px solid #dfe3e8;
      border-radius: 999px;
      background: #ffffff;
      color: #4b5563;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.15s ease;
    }

    .category-button:hover {
      border-color: #a5b4fc;
      color: #364fc7;
    }

    .category-button.active {
      border-color: #4263eb;
      background: #4263eb;
      color: #ffffff;
    }

    .result-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin: 30px 0 14px;
    }

    .result-count {
      font-size: 15px;
      color: #4b5563;
    }

    .result-count strong {
      color: #4263eb;
      font-size: 18px;
    }

    .show-all-button {
      padding: 9px 14px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      background: #ffffff;
      color: #374151;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
    }

    .show-all-button:hover {
      border-color: #9ca3af;
      background: #f9fafb;
    }

    .faq-list {
      display: grid;
      gap: 14px;
    }

    .faq-card {
      overflow: hidden;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      transition:
        transform 0.15s ease,
        box-shadow 0.15s ease,
        border-color 0.15s ease;
    }

    .faq-card:hover {
      transform: translateY(-2px);
      border-color: #d1d5db;
      box-shadow: 0 12px 30px rgba(15, 23, 42, 0.06);
    }

    .faq-question-area {
      padding: 22px 24px 18px;
    }

    .faq-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 13px;
    }

    .category-badge {
      display: inline-flex;
      align-items: center;
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
    }

    .category-교육 {
      color: #364fc7;
      background: #edf2ff;
    }

    .category-문서 {
      color: #087f5b;
      background: #e6fcf5;
    }

    .category-IT {
      color: #c2255c;
      background: #fff0f6;
    }

    .category-보안 {
      color: #d9480f;
      background: #fff4e6;
    }

    .question-label {
      color: #9ca3af;
      font-size: 12px;
      font-weight: 700;
    }

    .faq-question {
      margin: 0;
      font-size: 18px;
      line-height: 1.55;
      font-weight: 700;
      color: #111827;
      letter-spacing: -0.015em;
    }

    .faq-answer-area {
      padding: 18px 24px 22px;
      border-top: 1px solid #f0f1f3;
      background: #fafbfc;
    }

    .answer-label {
      display: block;
      margin-bottom: 8px;
      color: #6b7280;
      font-size: 12px;
      font-weight: 700;
    }

    .faq-answer {
      margin: 0;
      color: #4b5563;
      font-size: 15px;
      line-height: 1.75;
    }

    mark {
      padding: 1px 2px;
      border-radius: 3px;
      background: #fff3bf;
      color: #111827;
      font-weight: 700;
    }

    .empty-state {
      padding: 65px 20px;
      text-align: center;
      border: 1px dashed #d1d5db;
      border-radius: 16px;
      background: #ffffff;
    }

    .empty-icon {
      width: 48px;
      height: 48px;
      margin: 0 auto 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: #f3f4f6;
      font-size: 22px;
    }

    .empty-title {
      margin: 0 0 7px;
      font-size: 17px;
      font-weight: 700;
      color: #374151;
    }

    .empty-description {
      margin: 0;
      color: #9ca3af;
      font-size: 14px;
      line-height: 1.6;
    }

    .footer-note {
      margin-top: 24px;
      padding: 14px 16px;
      border-radius: 12px;
      background: #eef2ff;
      color: #4c5c91;
      font-size: 13px;
      line-height: 1.6;
    }

    @media (max-width: 640px) {
      .page {
        width: min(100% - 24px, 1100px);
        padding-top: 32px;
      }

      .search-panel {
        padding: 16px;
        border-radius: 14px;
      }

      #searchInput {
        height: 54px;
        font-size: 15px;
      }

      .faq-question-area,
      .faq-answer-area {
        padding-left: 18px;
        padding-right: 18px;
      }

      .faq-question {
        font-size: 16px;
      }

      .result-header {
        margin-top: 24px;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <header class="header">
      <span class="header-label">FAQ</span>
      <h1>업무 FAQ 검색</h1>
      <p class="description">
        업무 관련 질문이나 키워드를 검색해 FAQ를 확인하세요.
      </p>
    </header>

    <section class="search-panel" aria-label="FAQ 검색">
      <div class="search-box">
        <svg
          class="search-icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          aria-hidden="true"
        >
          <circle cx="11" cy="11" r="7"></circle>
          <path d="M20 20L16.5 16.5"></path>
        </svg>

        <input
          id="searchInput"
          type="search"
          placeholder="질문이나 키워드를 입력하세요."
          autocomplete="off"
          aria-label="FAQ 검색어"
        />

        <button
          id="clearSearchButton"
          class="clear-search"
          type="button"
          aria-label="검색어 지우기"
          title="검색어 지우기"
        >
          ×
        </button>
      </div>

      <div class="filter-area">
        <div class="filter-label">분류</div>

        <div
          id="categoryButtons"
          class="category-buttons"
          aria-label="FAQ 분류"
        >
          <button type="button" class="category-button active" data-category="전체">전체</button>
          <button type="button" class="category-button" data-category="교육">교육</button>
          <button type="button" class="category-button" data-category="문서">문서</button>
          <button type="button" class="category-button" data-category="IT">IT</button>
          <button type="button" class="category-button" data-category="보안">보안</button>
        </div>
      </div>
    </section>

    <section aria-live="polite">
      <div class="result-header">
        <div id="resultCount" class="result-count"></div>

        <button
          id="showAllButton"
          class="show-all-button"
          type="button"
        >
          전체보기
        </button>
      </div>

      <div id="faqList" class="faq-list"></div>
    </section>

    <div class="footer-note">
      이 화면은 등록된 FAQ 데이터만 표시합니다.
      검색 결과가 없는 경우 새로운 답변을 임의로 생성하지 않습니다.
    </div>
  </main>

  <script>
    const faqData = [
      {
        category: "교육",
        question: "교육 신청은 어디에서 하나요?",
        answer_seed: "교육 포털의 과정 검색 후 신청 메뉴를 사용합니다."
      },
      {
        category: "교육",
        question: "신청한 교육을 취소하려면 어떻게 하나요?",
        answer_seed: "신청내역에서 취소 가능 여부를 확인합니다."
      },
      {
        category: "문서",
        question: "주간 업무보고에는 무엇을 넣어야 하나요?",
        answer_seed: "주요 실적, 이슈, 다음 주 계획을 중심으로 작성합니다."
      },
      {
        category: "IT",
        question: "사내 시스템 접속이 되지 않습니다.",
        answer_seed: "네트워크, 브라우저, 계정 상태를 순서대로 확인합니다."
      },
      {
        category: "보안",
        question: "ChatGPT에 내부 업무자료를 넣어도 되나요?",
        answer_seed: "교육에서는 합성자료를 사용하고, 실제 자료는 조직의 보안 및 AI 사용 기준을 먼저 확인합니다."
      }
    ];

    let selectedCategory = "전체";
    let searchKeyword = "";

    const searchInput = document.getElementById("searchInput");
    const clearSearchButton = document.getElementById("clearSearchButton");
    const categoryButtons = document.getElementById("categoryButtons");
    const resultCount = document.getElementById("resultCount");
    const faqList = document.getElementById("faqList");
    const showAllButton = document.getElementById("showAllButton");

    function escapeHTML(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function escapeRegExp(value) {
      return value.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    }

    function highlightText(text, keyword) {
      const safeText = escapeHTML(text);

      if (!keyword.trim()) {
        return safeText;
      }

      const safeKeyword = escapeHTML(keyword.trim());
      const regex = new RegExp(
        `(${escapeRegExp(safeKeyword)})`,
        "gi"
      );

      return safeText.replace(regex, "<mark>$1</mark>");
    }

    function getFilteredData() {
      const keyword = searchKeyword
        .trim()
        .toLocaleLowerCase("ko-KR");

      return faqData.filter((faq) => {
        const matchesCategory =
          selectedCategory === "전체" ||
          faq.category === selectedCategory;

        if (!matchesCategory) {
          return false;
        }

        if (!keyword) {
          return true;
        }

        const searchableText = [
          faq.question,
          faq.answer_seed,
          faq.category
        ]
          .join(" ")
          .toLocaleLowerCase("ko-KR");

        return searchableText.includes(keyword);
      });
    }

    function createFaqCard(faq) {
      const article = document.createElement("article");
      article.className = "faq-card";

      const categoryClass = `category-${faq.category}`;

      article.innerHTML = `
        <div class="faq-question-area">
          <div class="faq-meta">
            <span class="category-badge ${categoryClass}">
              ${highlightText(faq.category, searchKeyword)}
            </span>
            <span class="question-label">질문</span>
          </div>

          <h2 class="faq-question">
            ${highlightText(faq.question, searchKeyword)}
          </h2>
        </div>

        <div class="faq-answer-area">
          <span class="answer-label">답변</span>

          <p class="faq-answer">
            ${highlightText(faq.answer_seed, searchKeyword)}
          </p>
        </div>
      `;

      return article;
    }

    function renderEmptyState() {
      faqList.innerHTML = `
        <div class="empty-state">
          <div class="empty-icon" aria-hidden="true">🔎</div>

          <p class="empty-title">
            검색 결과가 없습니다.
          </p>

          <p class="empty-description">
            등록된 FAQ 중 현재 검색 조건과 일치하는 항목이 없습니다.
          </p>
        </div>
      `;
    }

    function render() {
      const filteredData = getFilteredData();

      resultCount.innerHTML =
        `검색 결과 <strong>${filteredData.length}</strong>건`;

      faqList.innerHTML = "";

      if (filteredData.length === 0) {
        renderEmptyState();
      } else {
        filteredData.forEach((faq) => {
          faqList.appendChild(createFaqCard(faq));
        });
      }

      clearSearchButton.style.display =
        searchKeyword ? "flex" : "none";
    }

    searchInput.addEventListener("input", (event) => {
      searchKeyword = event.target.value;
      render();
    });

    clearSearchButton.addEventListener("click", () => {
      searchKeyword = "";
      searchInput.value = "";
      render();
      searchInput.focus();
    });

    categoryButtons.addEventListener("click", (event) => {
      const button = event.target.closest(".category-button");

      if (!button) {
        return;
      }

      selectedCategory = button.dataset.category;

      document
        .querySelectorAll(".category-button")
        .forEach((item) => {
          item.classList.remove("active");
        });

      button.classList.add("active");
      render();
    });

    showAllButton.addEventListener("click", () => {
      searchKeyword = "";
      selectedCategory = "전체";
      searchInput.value = "";

      document
        .querySelectorAll(".category-button")
        .forEach((button) => {
          const isAll = button.dataset.category === "전체";
          button.classList.toggle("active", isAll);
        });

      render();
    });

    render();
  </script>
</body>
</html>
